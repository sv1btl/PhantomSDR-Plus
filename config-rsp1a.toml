[server]
port=port # Server port
html_root="frontend/dist/" # HTML files to be hosted
otherusers=1 # Send where other users are listening, 0 to disable
threads=6

[websdr]
register_online=false # Enable directory registration updates
register_urls=[
  "https://sdr-list.xyz/api/update_websdr",
  "https://sdr.shbrg.nl/api/update_websdr"
  ] # One or more directory endpoints that accept the same JSON payload
name="USER PhantomSDR+" # Name that is shown on https://sdr-list.xyz and/or https://sdr.shbrg.nl/sdr/
antenna="Antenna." # Antenna that is shown on https://sdr-list.xyz
grid_locator="QTH Locator" # 4 or 6 length Grid Locatlr shown on https://sdr-list.xyz and for the Distance of FT8 Signals
hostname="your IP, or ddns, or no-ip" # If you use ddns or something to host with a domain enter it here for https://sdr-list.xyz

# In case you want to register to websdr.org, please uncomment and fill with your data
# [websdr.org]
# enabled     = true
# public_host = "yourIP"
# public_port = port
# qth         = "QTH Locator"
# description = "CallSign PhantomSDR+"
# email       = "mail@domain.com"
# logo        = "logo.jpg" #located in frontend public. Use the same or change it

[input]
# SDRPlay RSP1A optimized settings - HF/VHF coverage
#sps=8000000 # Input sample rate (RSP1A: up to 10MHz, 8MHz = 8MHz bandwidth)
sps=8000000 # Input Sample Rate
fft_size=524288 # FFT 524288 or 1048576bins
fft_threads=2
brightness_offset=-6 # Waterfall brightness offset. Reduce to negative if you see black regions in the waterfall
frequency=4000000 # Baseband frequency
# frequency=25000000 # Center frequency in Hz (25MHz for HF coverage)
signal="iq" # real or iq
accelerator="none" # Accelerator: none, cuda, opencl
audio_sps=12000 # Audio Sample Rate
audio_compression="flac" # flac or opus
waterfall_size=1024 #2048 # Waterfall display width in pixels
waterfall_compression="zstd" # Waterfall compression: "zstd" only
smeter_offset=0 # digital-only S-meter offset
analog_smeter_offset=0 # analog-only S-meter offset

[input.driver]
name="stdin" # Driver name
format="s16" # Sample format: u8, s8, u16, s16, u32, s32, f32, f64

[input.defaults]
frequency=3750000 # Default frequency to show user
modulation="LSB" # Default modulation

[kiwi_emulation]
enabled       = false
audio_gain    = 60.0    # dB, Kiwi clients only. 0 = untouched.
wf_cal        = 0.0   # dB, display taste. 0 = agrees with the S-meter.
wf_fps_max    = 23      # frames/s. 23 is the protocol maximum.
# smeter_offset = 5.0   # dB. Defaults to input.analog_smeter_offset.
